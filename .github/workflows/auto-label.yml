name: Auto Label

on:
  pull_request_target:
    types: [opened, ready_for_review, reopened, edited]
  issues:
    types: [opened, reopened, edited]

permissions:
  pull-requests: write
  issues: write

jobs:
  labeler:
    runs-on: ubuntu-latest
    steps:
      - name: Add label from title and author
        uses: actions/github-script@v7
        with:
          script: |
            const typeLabels = {
              docs: '📑 DOCS',
              feat: '🌱 FEAT',
              style: '🎀 STYLE',
              fix: '🔧 FIX',
              refactor: '💎 REFACTOR',
              chore: '🪜 CHORE',
            }

            const authorLabels = {
              yooseolhee: '🐰 설희',
              seojin15: '🐟 서진',
            }

            const item = context.payload.pull_request ?? context.payload.issue
            const title = item.title
            const author = item.user.login
            const match = title.match(
              /^\[(feat|fix|docs|style|refactor|chore)\]/i,
            )

            if (!match) {
              core.info(`No PR type found in title: ${title}`)
            }

            const type = match?.[1].toLowerCase()
            const typeLabel = type ? typeLabels[type] : null
            const authorLabel = authorLabels[author]

            const currentLabels = item.labels.map(({ name }) => name)
            const typeLabelNames = Object.values(typeLabels)

            const labelsToRemove = currentLabels.filter(
              (label) => typeLabelNames.includes(label) && label !== typeLabel,
            )

            for (const label of labelsToRemove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                name: label,
              })
            }

            const labelsToAdd = [typeLabel, authorLabel].filter((label) => label)

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: item.number,
                labels: labelsToAdd,
              })
            }
